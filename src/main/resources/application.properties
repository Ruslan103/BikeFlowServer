spring.application.name=demo
spring.config.import=optional:file:${BIKE_SETTINGS_FILE:./config/server-settings.properties},optional:file:./config/server-tls.properties
spring.sql.init.mode=always
spring.session.jdbc.initialize-schema=never
spring.session.timeout=8h
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
logging.file.name=./logs/bike-server-application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
