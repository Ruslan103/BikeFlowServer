<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · Craft Bike</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/admin-assets/admin.css">
  <script type="module" src="/admin-assets/login.js"></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">CB</span> CRAFT BIKE</a>
    <p class="eyebrow">УПРАВЛЕНИЕ СЕРВЕРОМ</p>
    <h1>Вход в кабинет</h1>
    <p class="muted">Войдите с учётной записью администратора, чтобы настроить сервер.</p>
    <form id="login-form">
      <label for="login">Логин</label>
      <input id="login" name="login" autocomplete="username" required maxlength="100" autofocus>
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
      <p id="message" class="message" role="alert" hidden></p>
      <button id="submit" class="button primary full" type="submit">Войти в кабинет <span aria-hidden="true">→</span></button>
    </form>
    <p class="footer-note">Доступ к настройкам разрешён только администратору.</p>
  </main>
</body>
</html>
